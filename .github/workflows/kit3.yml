name: Kit3 Belanda
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stills atau render"
        type: string
        default: "stills"
      frames:
        description: "daftar frame untuk stills"
        type: string
        default: "40,120,200,290,370,460,530,600,640,690,730,790,860,940,1100,1240,1390"
      width:
        description: "lebar frame"
        type: string
        default: "540"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pasang dependensi
        working-directory: kit3
        run: npm install --no-audit --no-fund
      - name: Pasang Chromium
        working-directory: kit3
        run: npx playwright install --with-deps chromium
      - name: Pasang Pillow
        run: python3 -m pip install --quiet --break-system-packages pillow
      - name: Bundle
        working-directory: kit3
        run: npm run bundle
      - name: Audit penempatan
        working-directory: kit3
        run: node audit.mjs
      - name: Render stills dan kontak sheet
        if: ${{ inputs.mode == 'stills' }}
        working-directory: kit3
        run: |
          node render.mjs stills "${{ inputs.frames }}" "${{ inputs.width }}"
          python3 sheet.py stills stills/contact.jpg 6
      - name: Render penuh 1080
        if: ${{ inputs.mode == 'render' }}
        working-directory: kit3
        run: |
          node render.mjs frames "0-725" 1080 > r1.log 2>&1 &
          node render.mjs frames "726-1450" 1080 > r2.log 2>&1 &
          wait
          tail -n 3 r1.log r2.log
          ls frames | wc -l
      - name: Encode video
        if: ${{ inputs.mode == 'render' }}
        working-directory: kit3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out frames
          ffmpeg -y -hide_banner -loglevel error -framerate 30 -i frames/f%04d.jpg -i work/voice.mp3 -c:v libx264 -crf 23 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest -movflags +faststart out/video.mp4
          ffprobe -v error -show_entries format=duration,size -of csv=p=0 out/video.mp4
      - name: Unggah frame mentah (kalau encode gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frames-kit3
          path: kit3/frames
          if-no-files-found: warn
          retention-days: 3

      - name: Unggah hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-kit3
          path: |
            kit3/stills
            kit3/out
            kit3/r1.log
            kit3/r2.log
          if-no-files-found: warn
