name: render-original

on:
  workflow_dispatch:
    inputs:
      frames:
        description: "frame list (mis. 400 atau 400,650)"
        default: "400"
      width:
        description: "lebar piksel"
        default: "1080"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: original
        run: npm install --no-audit --no-fund
      - name: Chromium
        working-directory: original
        run: npx playwright install --with-deps chromium
      - name: Bundle
        working-directory: original
        run: npm run bundle
      - name: Render
        working-directory: original
        run: node render.mjs frames "${{ inputs.frames }}" "${{ inputs.width }}"
      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-frames
          path: original/frames
          if-no-files-found: warn
